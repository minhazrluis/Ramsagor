<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>রামসাগরের প্রথম দেখা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: one portrait pixel stage (160x200) with HTML chat boxes floating over it, controls under it. */
:root{
  --ink:#14142b; --panel:#222246; --line:#5b5bb8; --paper:#f7f1d8; --paper-ink:#2a2147;
  --luis:#3aa0ff; --mou:#ff4d6d; --gold:#ffd23f; --mute:#a9a9d6;
  --ui:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --px:'Press Start 2P',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--ui);font-size:15px;margin:0;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:10px;overflow-x:hidden}
.stage{position:relative;width:min(100%,calc((100dvh - 150px) * .8),520px);aspect-ratio:4/5;background:#000;border:3px solid var(--line);
  box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--panel);overflow:hidden;touch-action:manipulation}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.cap{position:absolute;left:6px;right:6px;top:6px;text-align:center;font-weight:700;font-size:clamp(12px,3.4vw,16px);
  color:var(--paper);background:rgba(20,20,43,.82);border:2px solid var(--line);padding:4px 8px;pointer-events:none;min-height:28px}
.cap[hidden]{display:none}
.feed{position:absolute;left:6px;right:6px;bottom:6px;display:flex;flex-direction:column;gap:5px;pointer-events:none;align-items:stretch}
.msg{align-self:flex-start;max-width:86%;background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper-ink);
  padding:4px 9px;font-weight:500;font-size:clamp(13px,3.6vw,16px);line-height:1.35;word-break:break-word;
  box-shadow:3px 3px 0 rgba(0,0,0,.45);animation:rise .35s ease-out,fade 1s ease-in 11s forwards}
.msg.m{align-self:flex-end;border-color:var(--mou)} .msg.l{border-color:var(--luis)}
.msg b{font-size:.78em;margin-right:6px}
.msg.m b{color:var(--mou)} .msg.l b{color:var(--luis)}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{to{opacity:0;transform:translateY(-8px)}}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  background:rgba(14,14,36,.78);padding:16px}
.over[hidden]{display:none}
.title{font-family:var(--px);font-size:clamp(11px,3.6vw,16px);line-height:1.6;color:var(--gold);text-shadow:2px 2px 0 #7a2a00}
.sub{color:var(--paper);font-weight:500;max-width:30ch;line-height:1.45}
.btn{font-family:var(--ui);font-weight:700;font-size:16px;color:var(--ink);background:var(--paper);border:0;padding:9px 16px;cursor:pointer;
  box-shadow:0 4px 0 #8a7f55,0 0 0 2px var(--ink);min-height:44px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a7f55,0 0 0 2px var(--ink)}
.btn.l{background:var(--luis);color:#06223d;box-shadow:0 4px 0 #1a5c9b,0 0 0 2px var(--ink)}
.btn.m{background:var(--mou);color:#3a0210;box-shadow:0 4px 0 #a1213c,0 0 0 2px var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ghost{background:none;border:0;color:var(--mute);font-family:var(--ui);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
.status{font-size:13px;color:var(--mute);min-height:18px}
.dock{width:min(100%,calc((100dvh - 150px) * .8),520px);display:flex;flex-direction:column;gap:8px}
.chat{display:flex;gap:6px}
.chat input{flex:1;min-width:0;font:inherit;font-size:16px;background:var(--panel);color:var(--paper);border:2px solid var(--line);padding:8px 10px;min-height:44px}
.chat input::placeholder{color:var(--mute)}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.acts[hidden]{display:none}
.pad{min-width:60px;font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none}
.endmsg{font-size:clamp(28px,9vw,44px);font-weight:700;color:var(--paper)}
@media (prefers-reduced-motion:reduce){.msg{animation:none}}
.code{flex:1;min-width:0;font:inherit;font-size:16px;background:var(--panel);color:var(--paper);border:2px solid var(--line);padding:8px 10px;min-height:44px;max-width:210px}
</style>
</head>
<body>

<main class="stage" id="stage">
  <canvas id="cv" width="160" height="200" aria-label="খেলার পর্দা"></canvas>
  <div class="cap" id="cap" hidden></div>
  <div class="feed" id="feed" aria-live="polite"></div>
  <section class="over" id="lobby">
    <div class="title">LUIS &amp; MOU</div>
    <div class="title" style="color:var(--paper);font-size:clamp(9px,2.6vw,12px);text-shadow:none">রামসাগরের প্রথম দেখা</div>
    <div class="sub" id="lobbyHint">দুজনে একই গোপন কোড লিখে ঢোকো। তারপর নিজের নাম বাছো।</div>
    <div class="row" id="joinBox"><input class="code" id="codeIn" maxlength="24" placeholder="গোপন রুম কোড" aria-label="গোপন রুম কোড" autocapitalize="off" autocomplete="off"><button class="btn" id="joinBtn">ঢোকো</button></div>
    <div class="row" id="roleRow" hidden>
      <button class="btn l" id="pickL">আমি লুইস</button>
      <button class="btn m" id="pickM">আমি মৌ</button>
    </div>
    <div class="status" id="lobbyStatus"></div>
    <button class="ghost" id="testBtn">একা টেস্ট করে দেখি</button>
  </section>
  <section class="over" id="endcard" hidden style="background:rgba(14,14,36,.0);justify-content:flex-end;padding-bottom:28px">
    <div class="endmsg" id="endmsg" hidden>শেষ 😔</div>
  </section>
</main>

<div class="dock">
  <div class="acts" id="acts" hidden>
    <button class="btn pad" id="goL" aria-label="বামে যাও">◀</button>
    <button class="btn pad" id="goR" aria-label="ডানে যাও">▶</button>
    <button class="btn" id="hugBtn" disabled>আদর 🤗</button>
    <button class="btn" id="kissBtn" disabled>চুমু 😘</button>
    <button class="btn m" id="homeBtn" hidden>ফেরার সময়</button>
  </div>
  <form class="chat" id="chatForm" autocomplete="off">
    <input id="chatIn" maxlength="140" placeholder="কিছু লেখো..." disabled aria-label="মেসেজ লেখো">
    <button class="btn" id="sendBtn" disabled>পাঠাও</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="game.js"></script>
</body>
</html>
